plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'store.negocut'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// IDE·실행 방식(IntelliJ/VSCode/gradle 커맨드)에 따라 컴파일러가 메서드 파라미터 이름을
// 바이트코드에 남기는지 여부가 갈려서, @RequestParam 등에 name을 안 붙이면 특정 환경에서만
// "parameter name information not available via reflection" 500 에러가 나는 문제가 있었다
// (2026-07-30). 실행 환경과 무관하게 항상 남도록 고정.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 직거래 채팅의 방 단위 실시간 메시지 수신(WebSocket) 지원
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// 알림 실시간 push(SSE)에서 Flux/Sinks/ServerSentEvent 타입만 사용 — 서블릿(Tomcat) 스택은 유지된다
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// mybatis
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:2.1.0'
	// SQL 로그 (실행 SQL + 바인딩 값 출력)
	implementation 'com.integralblue:log4jdbc-spring-boot-starter:2.0.0'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// @ai_generated: 가입 이메일 인증번호를 실제 SMTP로 발송한다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	runtimeOnly 'com.mysql:mysql-connector-j'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// @ai_generated: 테스트 전용 키. 운영·개발 키와 분리하며 실제 개인정보 암호화에 사용하지 않는다.
	systemProperty 'app.crypto.aes-key-base64', 'AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8='
	systemProperty 'app.crypto.hmac-key-base64', 'ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8='
	// 포인트 대사 배치 2종은 컨텍스트 기동 즉시 실행되는 스케줄러라, application.properties의
	// 기본값(true)을 테스트에서는 꺼서 실DB에 자동으로 손대지 않게 한다(2026-07-21 사고 재발 방지).
	// 이 배치를 직접 검증하는 두 테스트 클래스는 @TestPropertySource로 자기 안에서만 다시 켠다.
	systemProperty 'point.reconciliation.scheduler.enabled', 'false'

	// 공유 DB(NCTDB)에 직접 붙는 @SpringBootTest가 여러 개라, 테스트 프로세스를 안 끄고
	// 방치하면 커넥션이 기본값(풀 10개, 최대수명 30분)만큼 계속 쌓인다 (2026-07-23,
	// SHOW PROCESSLIST에서 한 접속원에 50개 넘게 쌓여있는 것 확인 — src/test/resources
	// 쪽 설정 파일은 application.properties라는 이름 때문에 .gitignore에 걸려 팀 전체에
	// 안 퍼지므로 여기 build.gradle에 직접 둔다).
	systemProperty 'spring.datasource.hikari.maximum-pool-size', '3'
	systemProperty 'spring.datasource.hikari.minimum-idle', '1'
	systemProperty 'spring.datasource.hikari.idle-timeout', '30000'
	systemProperty 'spring.datasource.hikari.max-lifetime', '120000'
	// 커넥션을 빌려간 채 이 시간(ms) 넘게 반납하지 않으면 WARN 로그로 어느 코드가
	// 빌렸는지 스택트레이스를 남긴다 — 다음엔 IP 추적 없이 바로 잡힌다.
	systemProperty 'spring.datasource.hikari.leak-detection-threshold', '30000'
}

// 담당자 7 · F-OPS-018: 릴리즈 판단용 5개 핵심 시나리오만 실제 DB 계약으로 검증한다.
// 공유 DB 쓰기는 명시적인 허용값과 승인 식별값이 모두 있을 때만 시작한다.
tasks.register('fOps018E2e', Test) {
	group = 'verification'
	description = 'F-OPS-018 핵심 E2E 5개 시나리오를 실행합니다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()

	def requiredTests = [
			[filter: 'nct.auction.AuctionServiceTest.finalizeExpiredAuctionEndsWithWinningBid',
			 className: 'nct.auction.AuctionServiceTest',
			 testName: '최고입찰이 있는 만료 경매는 종료되고 홀딩이 보관금으로 전환된다'],
			[filter: 'nct.auction.AuctionServiceTest.buyNowConvertsHoldToEscrow',
			 className: 'nct.auction.AuctionServiceTest',
			 testName: '즉시구매 성공 시 구매자 홀딩을 보관금으로 전환한다'],
			[filter: 'nct.servicerequest.service.ServiceRequestQuoteSelectionDatabaseIntegrationTest.selectsQuoteAndCreatesTradeEscrowAndChatExactlyOnce',
			 className: 'nct.servicerequest.service.ServiceRequestQuoteSelectionDatabaseIntegrationTest',
			 testName: '견적 선택은 요청·견적·거래·보관금·채팅을 한 번만 확정한다'],
			[filter: 'nct.ops.operation.controller.AdminReportOperationSecurityTest.enforcesAdminRoleAndForwardsAuthenticatedDecision',
			 className: 'nct.ops.operation.controller.AdminReportOperationSecurityTest',
			 testName: 'enforcesAdminRoleAndForwardsAuthenticatedDecision()'],
			[filter: 'nct.ops.operation.service.AdminDisputeDecisionDatabaseIntegrationTest.holdsServiceTradeReportAndPreventsDuplicateDecision',
			 className: 'nct.ops.operation.service.AdminDisputeDecisionDatabaseIntegrationTest',
			 testName: '관리자 정산 보류 판정은 거래·정산 보류를 유지하고 같은 판정은 중복 처리하지 않는다'],
			[filter: 'nct.ops.operation.service.AdminDisputeDecisionDatabaseIntegrationTest.completesAndRejectsServiceTradeReports',
			 className: 'nct.ops.operation.service.AdminDisputeDecisionDatabaseIntegrationTest',
			 testName: '관리자 처리 완료와 반려는 접수 직전 거래 상태와 정산 대기를 각각 복구한다'],
			[filter: 'nct.ops.operation.service.AdminDisputeDecisionDatabaseIntegrationTest.openTradeReportBlocksServiceAutoCompletionAgainstActualMapper',
			 className: 'nct.ops.operation.service.AdminDisputeDecisionDatabaseIntegrationTest',
			 testName: '진행 중 거래 신고가 실제 연결돼 있으면 서비스 자동완료를 차단한다'],
			[filter: 'nct.trade.TradeAutoCompletionFlowTest.schedulerCompletesExpiredTradeAndCreatesSinglePendingSettlement',
			 className: 'nct.trade.TradeAutoCompletionFlowTest',
			 testName: 'schedulerCompletesExpiredTradeAndCreatesSinglePendingSettlement()'],
			[filter: 'nct.trade.TradeServiceTest.expiredServiceConfirmationKeepsChatRoomForGracePeriod',
			 className: 'nct.trade.TradeServiceTest',
			 testName: 'expiredServiceConfirmationKeepsChatRoomForGracePeriod()']
	]

	filter {
		requiredTests.each { includeTestsMatching it.filter }
		failOnNoMatchingTests = true
	}

	systemProperty 'app.crypto.aes-key-base64', 'AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8='
	systemProperty 'app.crypto.hmac-key-base64', 'ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8='
	systemProperty 'point.reconciliation.scheduler.enabled', 'false'
	systemProperty 'spring.datasource.hikari.maximum-pool-size', '3'
	systemProperty 'spring.datasource.hikari.minimum-idle', '1'
	systemProperty 'spring.datasource.hikari.idle-timeout', '30000'
	systemProperty 'spring.datasource.hikari.max-lifetime', '120000'

	doFirst {
		def allowWrite = System.getProperty('nct.test.db.allow-write')
				?: System.getenv('NCT_TEST_DB_ALLOW_WRITE')
		def approval = System.getProperty('nct.test.db.approval')
				?: System.getenv('NCT_TEST_DB_APPROVAL')
		if (!'true'.equalsIgnoreCase(allowWrite) || approval == null || approval.isBlank()) {
			throw new GradleException(
					'F-OPS-018 E2E는 NCT_TEST_DB_ALLOW_WRITE=true와 NCT_TEST_DB_APPROVAL 승인 식별값이 필요합니다.')
		}
		systemProperty 'nct.test.db.allow-write', allowWrite
		systemProperty 'nct.test.db.approval', approval
	}

	doLast {
		def resultDirectory = reports.junitXml.outputLocation.get().asFile
		def missingTests = requiredTests.findAll { required ->
			def resultFile = new File(resultDirectory, "TEST-${required.className}.xml")
			if (!resultFile.isFile()) {
				return true
			}
			def suite = new groovy.xml.XmlSlurper().parse(resultFile)
			def matchingCases = suite.testcase.findAll {
				it.@classname.text() == required.className && it.@name.text() == required.testName
			}
			return (matchingCases.size() != 1
					|| !matchingCases[0].failure.isEmpty()
					|| !matchingCases[0].error.isEmpty()
					|| !matchingCases[0].skipped.isEmpty())
		}.collect { it.filter }
		if (!missingTests.isEmpty()) {
			throw new GradleException(
					"F-OPS-018 필수 테스트가 모두 성공하지 않았습니다: ${missingTests.join(', ')}")
		}
	}
}
